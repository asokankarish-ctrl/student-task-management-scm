<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Library Management System</h1>
    <p>Add a book, then borrow, return, or remove it.</p>

    <label for="title">Book title</label>
    <input id="title" type="text" maxlength="100">

    <label for="author">Author</label>
    <input id="author" type="text" maxlength="100">

    <button onclick="addBook()">Add book</button>

    <p id="message" role="status"></p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="bookList"></tbody>
        </table>
    </div>

    <p>Practice version: books are cleared when you refresh or close this page.</p>

    <!-- Load JavaScript after the page elements exist. -->
    <script src="script.js"></script>
</body>
</html>
